[base]
env_name = fzero_gpu
seed = 73
async = 1
cudagraphs = 1
checkpoint_interval = 10
eval_episodes = 256

[vec]
total_agents = 4096
num_buffers = 1
num_threads = 1
num_policies = 1
hist_policy_percent = 0

[env]
# The full port is loaded once to decode the user's private ROM and export an
# in-memory course LUT plus canonical reset template. No extracted asset is
# written to disk or copied into a checkpoint.
core_lib_path = ../G-Diffuser/build/rl-headless/port/libgdiffuser_rl.so
rom_path = ../private/baserom.us.rev0.z64
seed = 73
course_index = 0
character = 0
machine_skin = 0
laps = 1
action_repeat = 4
max_episode_frames = 9000
stall_frames = 600
stall_progress = 100.0
engine_balance = 0.5
steering_curriculum = 1
reward_scale = 0.03125
# Successful terminal reward is clamp(target / physics_frames, 0, 1).
# Fatal outcomes are -1; timeout and stall truncations are 0.
finish_time_target_frames = 2000
course_samples = 4096

# Reduced-simulator v0 coefficients. These are deliberately configuration,
# not claims of stock-physics parity; CPU trace fitting will replace/tune them.
gpu_engine_target_speed = 60.0
gpu_engine_acceleration = 0.25
gpu_forward_drag = 0.997
gpu_brake_drag = 0.987
gpu_steering_rate = 0.032
gpu_wall_margin = 1.0

[policy]
hidden_size = 128
num_layers = 2

[train]
gpus = 1
total_timesteps = 10_485_760
learning_rate = 0.003
anneal_lr = 1
replay_ratio = 4
ent_coef = 0.0001
gamma = 0.999
gae_lambda = 0.95
minibatch_size = 32768
horizon = 128

[sweep]
gpus = 1
max_runs = 40

[sweep.vec.total_agents]
enabled = 0

[sweep.train.horizon]
enabled = 0

[sweep.train.minibatch_size]
enabled = 0
